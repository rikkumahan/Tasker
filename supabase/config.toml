[functions.webhook_ingest]
verify_jwt = false

[functions.background_worker]
verify_jwt = false
# Safe: takes zero parameters, only drains already-enqueued/already-scoped sync_queue rows.
# Must stay unauthenticated so the tasker-queue-pulse cron failsafe (jobid 3) can reach it
# without a service-role Authorization header (ISSUE-5 in TaskerAI/e2e/ISSUES.md).

[functions.renew_gmail_watches]
verify_jwt = false
# Safe: takes zero parameters, iterates ACTIVE users server-side only. Must stay
# unauthenticated for the same reason as background_worker — pg_cron's net.http_post
# sends no apikey/Authorization header.


[functions.delete-account]
enabled = true
verify_jwt = false
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]
